name: Tag release
# A merged release PR (`/release`, `chore(release): vX.Y.Z`) bumps `package.json`. When `main` carries a
# version with no tag yet, this tags that commit `vX.Y.Z` and publishes it through release.yml in the
# same run: a tag pushed with GITHUB_TOKEN would not start release.yml on its own. Any other merge to
# `main` leaves the version alone, so nothing is tagged.
on:
  push:
    branches: [main]
    paths: [package.json]
permissions:
  contents: read
concurrency:
  group: tag-release
  cancel-in-progress: false
jobs:
  tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - id: tag
        name: Tag a new version
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="v${version}"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null; then
            echo "${tag} already exists: nothing to release."
            exit 0
          fi
          if ! grep -q "^## \[${version}\]" CHANGELOG.md; then
            echo "package.json is at ${version} but CHANGELOG.md has no [${version}] section" >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "${tag}" -m "${tag}" "${GITHUB_SHA}"
          git push origin "refs/tags/${tag}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
  release:
    needs: tag
    if: needs.tag.outputs.tag != ''
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
