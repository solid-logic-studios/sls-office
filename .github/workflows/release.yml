name: Release
on:
  # A merged release PR is tagged and published by tag-release.yml, which calls this with the tag
  # (a tag pushed with GITHUB_TOKEN starts no workflow). Pushing a tag by hand still works as a fallback.
  push:
    tags: ['v*']
  workflow_call:
    inputs:
      tag:
        description: The release tag to publish, vX.Y.Z
        required: true
        type: string
  # Recovery: republish an existing tag whose release run failed (Actions > Release > Run workflow).
  workflow_dispatch:
    inputs:
      tag:
        description: The existing release tag to publish, vX.Y.Z
        required: true
        type: string
permissions:
  contents: write
  packages: write
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
      - name: Tag must match package.json version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v${version}" ]; then
            echo "Tag $TAG does not match package.json version v${version}" >&2
            exit 1
          fi
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/solid-logic-studios/sls-office
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ env.TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.TAG }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          # The package is public (infrastructure ADR-0018): no provenance or SBOM attestation,
          # whose GitHub event payload (commit messages, emails, repo metadata) would be public too.
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${TAG#v}"
          awk -v v="$version" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && (/^## \[/ || /^\[[^]]+\]: /) { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ -s release-notes.md ] && grep -q '[^[:space:]]' release-notes.md; then
            notes=(--notes-file release-notes.md)
          else
            notes=(--generate-notes)
          fi
          gh release create "$TAG" dist/schema/snapshot.v1.schema.json \
            --title "$TAG" "${notes[@]}"
